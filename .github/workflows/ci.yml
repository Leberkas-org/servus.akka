name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'Package version for packing (without v prefix)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: ./src/global.json

      - name: Restore
        run: dotnet restore ./src/Servus.Akka.slnx

      - name: Build
        run: >
          dotnet build
          --configuration Release
          --no-restore
          ./src/Servus.Akka.slnx

      - name: Test
        working-directory: ./src
        run: >
          dotnet test
          --configuration Release
          --no-ansi
          --no-build
          --coverage
          --coverage-output-format xml
          --solution Servus.Akka.slnx
          --results-directory ./TestResults

      - name: Pack
        if: inputs.version != ''
        run: >
          dotnet pack
          --configuration Release
          --no-build
          --output ./nupkg
          ./src/Servus.Akka.slnx
          -p:PackageVersion=${{ inputs.version }}

      - name: Upload NuGet packages
        if: inputs.version != ''
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg
